name: Distribute and Deploy

on:
  push:
    paths:
      - "data/**"
      - "config.txt"
      - "permissions.txt"

jobs:
  process-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate config.txt from data/
        run: |
          python3 - <<'EOF'
          import os, re

          data_dir    = "data"
          config_path = "config.txt"

          # 既存 config.txt を読み込み（コメント・空行・非 type:NNN 行は温存）
          if os.path.isfile(config_path):
              with open(config_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
          else:
              lines = []

          slot_re = re.compile(r"^([^:#\s]+)\s*:\s*\d+\s*$")

          # data/[type]/ をスキャンして最大スロット番号を集計
          type_slots = {}
          if os.path.isdir(data_dir):
              for type_name in sorted(os.listdir(data_dir)):
                  type_dir = os.path.join(data_dir, type_name)
                  if not os.path.isdir(type_dir) or type_name == ".gitkeep":
                      continue
                  max_slot = 0
                  for entry in os.listdir(type_dir):
                      entry_path = os.path.join(type_dir, entry)
                      if not os.path.isdir(entry_path):
                          continue
                      try:
                          n = int(entry)
                      except ValueError:
                          continue
                      if n > max_slot:
                          max_slot = n
                  type_slots[type_name] = max_slot

          # 既存行のうち type:NNN 形式の行を、現状の data/ に合わせて更新／削除
          new_lines = []
          seen = set()
          for line in lines:
              m = slot_re.match(line.strip())
              if not m:
                  new_lines.append(line)
                  continue
              type_name = m.group(1)
              if type_name in type_slots:
                  new_lines.append(f"{type_name}:{type_slots[type_name]:03d}\n")
                  seen.add(type_name)
              # data/ に無い type の行はドロップ

          # data/ にあるが config.txt に未記載の type を末尾に追加
          missing = [t for t in type_slots if t not in seen]
          if missing:
              if new_lines and not new_lines[-1].endswith("\n"):
                  new_lines[-1] += "\n"
              for type_name in sorted(missing):
                  new_lines.append(f"{type_name}:{type_slots[type_name]:03d}\n")

          with open(config_path, "w", encoding="utf-8") as f:
              f.writelines(new_lines)

          for t in sorted(type_slots):
              print(f"{t}: max slot -> {type_slots[t]:03d}")
          print("config.txt regenerated")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.txt
          git diff --cached --quiet || git commit -m "auto: refresh config.txt from data/"
          git push

      - name: Build deploy directory
        run: |
          mkdir -p _site
          cp config.txt _site/
          cp permissions.txt _site/
          cp -r data/ _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: process-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
